    <path d="M 182 116 L 214 150 L 182 184" fill="none" stroke="url(#primaryGradMask)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <text x="125" y="166" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" text-anchor="middle">SF</text>
