<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4" />

  <!-- Center Icon: Mobile Device + Code Symbol + 'SF' -->
  <g transform="translate(136, 96)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="240" height="320" rx="36" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="8" />
    <!-- Speaker slit -->
    <line x1="90" y1="20" x2="150" y2="20" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <!-- Screen area -->
    <rect x="16" y="44" width="208" height="232" rx="16" fill="#090d16" />
    
    <!-- Code Brackets and Slash / Monogram -->
    <path d="M 68 116 L 36 150 L 68 184" fill="none" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 172 116 L 204 150 L 172 184" fill="none" stroke="url(#primaryGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <text x="120" y="166" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="1">SF</text>
    <circle cx="120" cy="204" r="5" fill="#38bdf8" />

    <!-- Home indicator bar -->
    <line x1="84" y1="298" x2="156" y2="298" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
